name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create fresh Flutter project structure
        run: flutter create . --org Vibra.Kirci --project-name vibrachat --platforms=android
      - run: flutter pub get
      - name: Build APK with verbose logging
        run: flutter build apk --release -v
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
