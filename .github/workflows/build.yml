name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Generate Fresh Flutter Android Project
        run: |
          # Mevcut eksik/bozuk android dosyalarını temizle
          rm -rf android
          # Yepyeni, hatasız ve v2 altyapılı bir Flutter iskeleti kur
          flutter create . --org com.vibrachat --project-name vibrachat --platforms=android
      - name: Get Dependencies
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
